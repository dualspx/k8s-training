title: Protect a Deployment with a PodDisruptionBudget
description: >
  In namespace "scenario-cluster-pdb", create a Deployment "web" (nginx:1.25,
  3 replicas, label app=web) and a PodDisruptionBudget "web-pdb" that keeps at
  least 2 of its Pods available during voluntary disruptions such as node drains.
category: cluster
difficulty: medium
points: 15
hint_penalty: 3
hints:
  - "kubectl create pdb web-pdb --selector=app=web --min-available=2 -n <ns>"
answer: |
  kubectl create namespace scenario-cluster-pdb
  kubectl create deployment web --image=nginx:1.25 --replicas=3 -n scenario-cluster-pdb
  kubectl create pdb web-pdb --selector=app=web --min-available=2 -n scenario-cluster-pdb
verify:
  - type: field_equals
    kind: Deployment
    namespace: scenario-cluster-pdb
    name: web
    field: spec.replicas
    value: 3
  - type: field_equals
    kind: PodDisruptionBudget
    namespace: scenario-cluster-pdb
    name: web-pdb
    field: spec.minAvailable
    value: 2
  - type: field_equals
    kind: PodDisruptionBudget
    namespace: scenario-cluster-pdb
    name: web-pdb
    field: spec.selector.matchLabels.app
    value: web
reset:
  - kind: Namespace
    name: scenario-cluster-pdb
