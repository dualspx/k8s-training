title: Mount a Secret as a volume
description: >
  In namespace "scenario-workloads-secret", create a generic Secret named
  "db-creds" with username=admin and password=s3cr3t. Then create a Pod named
  "db-client" (image busybox, command `sleep 3600`) that mounts the Secret
  read-only at /etc/creds.
category: workloads
difficulty: medium
points: 15
hint_penalty: 3
hints:
  - "kubectl create secret generic db-creds --from-literal=username=admin --from-literal=password=s3cr3t"
  - "Pod spec: volumes[].secret.secretName plus containers[].volumeMounts[] with readOnly: true."
answer: |
  kubectl create namespace scenario-workloads-secret
  kubectl create secret generic db-creds \
    --from-literal=username=admin --from-literal=password=s3cr3t \
    -n scenario-workloads-secret
  cat <<'EOF' | kubectl apply -n scenario-workloads-secret -f -
  apiVersion: v1
  kind: Pod
  metadata:
    name: db-client
  spec:
    containers:
      - name: db-client
        image: busybox
        command: ["sleep", "3600"]
        volumeMounts:
          - name: creds
            mountPath: /etc/creds
            readOnly: true
    volumes:
      - name: creds
        secret:
          secretName: db-creds
  EOF
verify:
  - type: resource_exists
    kind: Secret
    namespace: scenario-workloads-secret
    name: db-creds
  - type: field_equals
    kind: Pod
    namespace: scenario-workloads-secret
    name: db-client
    field: spec.volumes.0.secret.secretName
    value: db-creds
  - type: field_equals
    kind: Pod
    namespace: scenario-workloads-secret
    name: db-client
    field: spec.containers.0.volumeMounts.0.mountPath
    value: /etc/creds
  - type: field_equals
    kind: Pod
    namespace: scenario-workloads-secret
    name: db-client
    field: spec.containers.0.volumeMounts.0.readOnly
    value: true
reset:
  - kind: Namespace
    name: scenario-workloads-secret
