title: Deployment never becomes Ready
description: >
  In namespace "scenario-troubleshooting-readiness", Deployment "shop" (2
  replicas of nginx) has Pods that are Running but never Ready, so Service
  "shop" has no endpoints. Find out why and fix the Deployment so both
  replicas become Ready. Run `cka-game start troubleshooting-failing-readiness`
  first.
category: troubleshooting
difficulty: medium
points: 15
hint_penalty: 3
hints:
  - "kubectl describe pod <pod> -n scenario-troubleshooting-readiness — look at the Readiness probe failure events."
  - "nginx serves / but not /healthz; change readinessProbe.httpGet.path on the Deployment's Pod template."
setup: |
  kubectl create namespace scenario-troubleshooting-readiness
  cat <<'EOF' | kubectl apply -n scenario-troubleshooting-readiness -f -
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: shop
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: shop
    template:
      metadata:
        labels:
          app: shop
      spec:
        containers:
          - name: nginx
            image: nginx:1.25
            readinessProbe:
              httpGet:
                path: /healthz
                port: 80
              periodSeconds: 3
  ---
  apiVersion: v1
  kind: Service
  metadata:
    name: shop
  spec:
    selector:
      app: shop
    ports:
      - port: 80
  EOF
answer: |
  kubectl patch deployment shop -n scenario-troubleshooting-readiness --type=json \
    -p '[{"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/httpGet/path","value":"/"}]'
  kubectl rollout status deployment/shop -n scenario-troubleshooting-readiness --timeout=120s
verify:
  - type: field_equals
    kind: Deployment
    namespace: scenario-troubleshooting-readiness
    name: shop
    field: spec.template.spec.containers.0.readinessProbe.httpGet.path
    value: /
  - type: field_equals
    kind: Deployment
    namespace: scenario-troubleshooting-readiness
    name: shop
    field: status.readyReplicas
    value: 2
reset:
  - kind: Namespace
    name: scenario-troubleshooting-readiness
