title: ServiceAccounts in two namespaces
description: >
  Namespaces "scenario-security-sa-ns1" and "scenario-security-sa-ns2" already
  exist (run `cka-game start security-serviceaccounts-two-namespaces` first).
  Create a ServiceAccount named "pipeline" in both of them.
category: security
difficulty: easy
points: 5
hint_penalty: 1
hints:
  - "kubectl create serviceaccount <name> -n <namespace>"
setup: |
  kubectl create namespace scenario-security-sa-ns1
  kubectl create namespace scenario-security-sa-ns2
answer: |
  kubectl create serviceaccount pipeline -n scenario-security-sa-ns1
  kubectl create serviceaccount pipeline -n scenario-security-sa-ns2
verify:
  - type: resource_exists
    kind: ServiceAccount
    namespace: scenario-security-sa-ns1
    name: pipeline
  - type: resource_exists
    kind: ServiceAccount
    namespace: scenario-security-sa-ns2
    name: pipeline
reset:
  - kind: Namespace
    name: scenario-security-sa-ns1
  - kind: Namespace
    name: scenario-security-sa-ns2
