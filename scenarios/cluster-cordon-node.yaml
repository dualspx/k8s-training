title: Cordon a node
description: >
  Mark node "{worker2}" as unschedulable using kubectl cordon.
  (This scenario has no automated reset — run "kubectl uncordon
  {worker2}" yourself before retrying, since undoing a cordon
  isn't a delete.)
category: cluster
difficulty: easy
points: 5
hint_penalty: 1
hints:
  - "kubectl cordon <node-name>"
answer: |
  kubectl cordon {worker2}
verify:
  - type: field_equals
    kind: Node
    name: "{worker2}"
    field: spec.unschedulable
    value: true
reset: []
