title: Run a DaemonSet
description: >
  In namespace "scenario-workloads-daemonset", create a DaemonSet named
  "log-agent" running image busybox:1.36 with the command `sleep 3600`, so
  one Pod runs on every node.
category: workloads
difficulty: medium
points: 15
hint_penalty: 3
hints:
  - "There is no `kubectl create daemonset`. Generate a Deployment manifest with --dry-run=client -o yaml, then change kind to DaemonSet and delete replicas/strategy."
answer: |
  kubectl create namespace scenario-workloads-daemonset
  cat <<'EOF' | kubectl apply -n scenario-workloads-daemonset -f -
  apiVersion: apps/v1
  kind: DaemonSet
  metadata:
    name: log-agent
  spec:
    selector:
      matchLabels:
        app: log-agent
    template:
      metadata:
        labels:
          app: log-agent
      spec:
        containers:
          - name: log-agent
            image: busybox:1.36
            command: ["sleep", "3600"]
  EOF
verify:
  - type: resource_exists
    kind: DaemonSet
    namespace: scenario-workloads-daemonset
    name: log-agent
  - type: container_image_equals
    kind: DaemonSet
    namespace: scenario-workloads-daemonset
    name: log-agent
    value: busybox:1.36
reset:
  - kind: Namespace
    name: scenario-workloads-daemonset
